<!DOCTYPE html><html lang="no"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siden finnes ikke — DJ Tiny</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0410">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230A0410'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E">
<link rel="preload" href="/fonter/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonter/fonter.css">
<style>
:root{--bg:#0A0410;--pink:#FF2E9A;--violet:#8A2BE2;--ice:#5EE9FF;--text:#F3E9FF;--mute:#9E86BC;--line:rgba(243,233,255,.14)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 38%,rgba(138,43,226,.22),transparent 60%),var(--bg);color:var(--text);font:400 17px/1.6 "Outfit",sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
header{border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;height:72px;max-width:1200px;margin:0 auto;padding-inline:clamp(20px,5vw,56px)}
.n{font-family:"Monoton",cursive;font-size:20px;color:#fff;text-shadow:0 0 10px var(--pink)}
main{flex:1;display:grid;place-items:center;text-align:center;padding:60px clamp(20px,5vw,56px)}
.tag{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--ice);font-weight:600;margin:0}
h1{font-family:"Monoton",cursive;font-weight:400;font-size:clamp(72px,18vw,160px);line-height:1;margin:18px 0 0;color:#fff;text-shadow:0 0 6px var(--pink),0 0 22px var(--pink),0 0 54px var(--violet)}
h2{font:800 clamp(22px,4vw,34px)/1.2 "Outfit",sans-serif;text-transform:uppercase;margin:26px 0 0}
p.tekst{color:var(--mute);max-width:44ch;margin:14px auto 0}
.knapper{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:34px}
.btn{display:inline-block;font:600 13px "Outfit",sans-serif;letter-spacing:.18em;text-transform:uppercase;padding:14px 28px;border-radius:999px;color:#fff;background:linear-gradient(90deg,var(--pink),var(--violet));box-shadow:0 0 24px rgba(255,46,154,.5);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(255,46,154,.75)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--ice)}
.btn.ghost:hover{border-color:var(--ice);box-shadow:0 0 22px rgba(94,233,255,.35)}
footer{border-top:1px solid var(--line);padding:28px clamp(20px,5vw,56px);color:var(--mute);font-size:13px;letter-spacing:.1em;text-align:center}
footer a{color:var(--ice)}
@media(max-width:560px){.btn{width:min(100%,320px);text-align:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header><div class="nav"><a class="n" href="/">DJ TINY</a></div></header>

<main>
 <div>
  <p class="tag">Feil 404</p>
  <h1>404</h1>
  <h2>Denne låta finnes ikke</h2>
  <p class="tekst">Siden du lette etter er flyttet eller finnes ikke lenger. Prøv en av disse i stedet:</p>
  <div class="knapper">
   <a class="btn" href="/">Til forsiden</a>
   <a class="btn ghost" href="/musikkbingo">Musikkbingo</a>
   <a class="btn ghost" href="/#book">Send forespørsel</a>
  </div>
 </div>
</main>

<footer>© DJ Tiny 2026 · <a href="mailto:booking@djtiny.no">booking@djtiny.no</a></footer>

</body></html>
