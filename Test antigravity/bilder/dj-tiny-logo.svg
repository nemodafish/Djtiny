<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
 <defs>
  <radialGradient id="spot" cx="50%" cy="42%" r="65%">
   <stop offset="0%" stop-color="#2a0f45"/>
   <stop offset="100%" stop-color="#0A0410"/>
  </radialGradient>
  <filter id="blurLarge" x="-50%" y="-50%" width="200%" height="200%">
   <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="blurMed" x="-50%" y="-50%" width="200%" height="200%">
   <feGaussianBlur stdDeviation="7"/>
  </filter>
 </defs>

 <rect width="1200" height="630" fill="url(#spot)"/>

 <g font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="150" letter-spacing="6" text-anchor="middle">
  <text x="600" y="345" fill="#8A2BE2" filter="url(#blurLarge)">DJ TINY</text>
  <text x="600" y="345" fill="#FF2E9A" filter="url(#blurMed)">DJ TINY</text>
  <text x="600" y="345" fill="#ffffff">DJ TINY</text>
 </g>

 <text x="600" y="410" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="28"
